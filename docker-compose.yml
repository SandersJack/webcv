version: '3'

services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./templates:/usr/share/nginx/html
      - ./static:/usr/share/nginx/html/static
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"

  contact:
    build:
      context: .
      dockerfile: dockerfile_node
    ports:
      - "3333:3333"
